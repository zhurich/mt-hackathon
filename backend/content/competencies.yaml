# Справочник компетенций проводника ВСМ.
# Коды используются в сценариях (поле competencies узла) и в аналитике.

- code: communication
  title: Коммуникация
  description: Общение по ролевой модели «Признать ситуацию — Обозначить правило — Предложить решение — Заверить».

- code: conflict
  title: Деэскалация конфликтов
  description: Не вступать в спор, не занимать сторону, разводить участников, снижать напряжение.

- code: safety
  title: Безопасность на борту
  description: Своевременно пресекать угрозы безопасности движения и пассажиров, не создавать новых.

- code: escalation
  title: Эскалация и работа с бригадой
  description: Вовремя подключать начальника поезда, ПТБ, бортинженера, медиков — не раньше и не позже, чем нужно.

- code: first_aid
  title: Медицинское реагирование
  description: Действия при ухудшении самочувствия пассажира в рамках компетенции проводника.

- code: regulations
  title: Знание правил и стандартов
  description: Правила перевозки и стандарты обслуживания ВСМ (СТО РЖД 03.011, 03.013, 03.014).

- code: accessibility
  title: Особые категории пассажиров
  description: Маломобильные пассажиры, дети, пассажиры с животными — помощь без ущерба достоинству.
